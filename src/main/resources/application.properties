spring.application.name=assignment-service

server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/assetflow_assignment?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Conexion con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Ruta para enviar eventos de auditoria
app.rabbitmq.routes.audit.exchange=assetflow.audit.exchange
app.rabbitmq.routes.audit.queue=audit-events-queue
app.rabbitmq.routes.audit.routing-key=assignment.audit

eureka.client.enabled=false
spring.cloud.discovery.enabled=false
